name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_debug:
        description: 'Run a one-off full-solution Debug build before Release validation'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Linux / Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Show SDK environment
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Formloom.slnx

      - name: One-off Debug verification
        if: github.event_name == 'workflow_dispatch' && inputs.verify_debug
        run: dotnet build Formloom.slnx --configuration Debug --no-restore --warnaserror

      - name: Build
        run: dotnet build Formloom.slnx --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test --solution Formloom.slnx --configuration Release --no-build --no-restore --report-trx --results-directory TestResults

      - name: Report ceramic timing sidecars (temporary diagnostic)
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import glob
          import json
          for path in sorted(glob.glob('artifacts/**/formloom-ceramic-*.timing.json', recursive=True)):
              with open(path, encoding='utf-8') as handle:
                  report = json.load(handle)
              name = path.rsplit('/', 1)[-1].replace('.timing.json', '')
              print(f"::notice title={name}::{report['RenderAndEncodeMilliseconds']:.2f} ms for {report['Count']} objects at {report['rendered']['Width']}x{report['rendered']['Height']}")
          for path in sorted(glob.glob('artifacts/**/formloom-ceramic-*.png', recursive=True)):
              print(f"::notice title=artifact::{path.rsplit('/', 1)[-1]}")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-Release
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload procedural preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-preview
          path: |
            artifacts/bin/Formloom.Tests/**/formloom-*.png
            artifacts/bin/Formloom.Tests/**/formloom-*.timing.json
          if-no-files-found: error
