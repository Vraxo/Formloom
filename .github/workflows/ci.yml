name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_debug:
        description: 'Run a one-off full-solution Debug build before Release validation'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Linux / Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Show SDK environment
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Formloom.slnx

      - name: One-off Debug verification
        if: github.event_name == 'workflow_dispatch' && inputs.verify_debug
        run: dotnet build Formloom.slnx --configuration Debug --no-restore --warnaserror

      - name: Build
        run: dotnet build Formloom.slnx --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test --solution Formloom.slnx --configuration Release --no-build --no-restore --report-trx --results-directory TestResults

      - name: Surface failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          ns = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          failures = []
          for path in glob.glob('TestResults/**/*.trx', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for unit in root.iter(ns + 'UnitTestResult'):
                  if unit.get('outcome') == 'Failed':
                      name = unit.get('testName', '?')
                      message = ''
                      for node in unit.iter(ns + 'Message'):
                          message = ' '.join((node.text or '').split())
                          break
                      failures.append((name, message[:240]))

          seen = set()
          for name, message in failures:
              if name in seen:
                  continue
              seen.add(name)
              print('::error::FAIL ' + name + ' :: ' + message)
              if len(seen) >= 12:
                  break
          print('failed test entries: ' + str(len(failures)))
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-Release
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload procedural preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-preview
          path: |
            artifacts/bin/Formloom.Tests/**/formloom-*.png
            artifacts/bin/Formloom.Tests/**/formloom-*.timing.json
          if-no-files-found: error
