name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_debug:
        description: 'Run a one-off full-solution Debug build before Release validation'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Linux / Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Show SDK environment
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Formloom.slnx

      - name: One-off Debug verification
        if: github.event_name == 'workflow_dispatch' && inputs.verify_debug
        run: dotnet build Formloom.slnx --configuration Debug --no-restore --warnaserror

      - name: Build
        run: dotnet build Formloom.slnx --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test --solution Formloom.slnx --configuration Release --no-build --no-restore --report-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-Release
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload procedural preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-preview
          path: |
            artifacts/bin/Formloom.Tests/**/formloom-*.png
            artifacts/bin/Formloom.Tests/**/formloom-*.timing.json
          if-no-files-found: error

      - name: Assemble focused Phase 10 rose review bundle
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          output_root="artifacts/bin/Formloom.Tests"
          bundle="artifacts/phase10-rose-review"
          mkdir -p "$bundle"
          mapfile -t rose_files < <(
            find "$output_root" -type f \
              \( -name 'formloom-vase-rose-*.png' -o -name 'formloom-vase-rose-*.timing.json' \) \
              -print | sort
          )
          png_count=0
          timing_count=0
          silhouette_sheet_count=0
          for file in "${rose_files[@]}"; do
            case "$file" in
              *.png)
                png_count=$((png_count + 1))
                if [[ "$(basename "$file")" == "formloom-vase-rose-canonical-silhouette-sheet.png" ]]; then
                  silhouette_sheet_count=$((silhouette_sheet_count + 1))
                fi
                ;;
              *.timing.json) timing_count=$((timing_count + 1)) ;;
            esac
          done
          if [[ "${#rose_files[@]}" -ne 25 || "$png_count" -ne 15 || "$timing_count" -ne 10 || "$silhouette_sheet_count" -ne 1 ]]; then
            printf 'Expected 25 rose files (15 PNGs, including one white-backed silhouette sheet, and 10 timing sidecars), found %s (%s PNGs, %s timing sidecars, %s silhouette sheets)\n' \
              "${#rose_files[@]}" "$png_count" "$timing_count" "$silhouette_sheet_count" >&2
            printf '%s\n' "${rose_files[@]}" >&2
            exit 1
          fi
          cp "${rose_files[@]}" "$bundle/"
          cat > "$bundle/README.txt" <<'EOF'
          Phase 10 — focused rose review bundle

          This bundle contains only the Phase 10 rose review outputs:
          - canonical and robustness 2 × 2 sheets, each with its timing manifest;
          - a white-backed 2 × 2 canonical silhouette sheet (full-resolution source masks);
          - eight 1024 × 1024 samples with timing/geometry sidecars;
          - four original transparent canonical silhouette PNGs.

          The silhouette sheet is row-major: red/blue, red/cream, pink/blue, pink/cream.
          Start with the sheets, then use the full-size PNGs to inspect details.
          Timing values are single-runner render-and-encode observations, not benchmarks.
          EOF

      - name: Upload focused Phase 10 rose review bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-rose-review
          path: artifacts/phase10-rose-review/
          if-no-files-found: error

  blender-cube-prototype:
    name: Blender / Procedural geometry renders
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install official Blender distribution with OpenImageDenoise
        shell: bash
        run: |
          set -euo pipefail
          version="4.5.16"
          archive="blender-${version}-linux-x64.tar.xz"
          checksum="blender-${version}.sha256"
          release_url="https://download.blender.org/release/Blender4.5"
          # The hosted runner's Azure Ubuntu mirror occasionally fails DNS resolution.
          # Replace that mirror with a stable public mirror before resolving Blender's
          # small set of runtime libraries.
          sudo grep -RIl 'azure.archive.ubuntu.com' /etc/apt 2>/dev/null \
            | xargs -r sudo sed -i 's|azure.archive.ubuntu.com|mirrors.edge.kernel.org|g'
          sudo apt-get -o Acquire::Retries=4 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=4 -o Acquire::https::Timeout=30 install \
            --no-install-recommends -y \
            libegl1 libgl1 libice6 libsm6 libx11-6 libxfixes3 libxi6 \
            libxkbcommon0 libxrender1 libxxf86vm1
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$release_url/$archive"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$checksum" "$release_url/$checksum"
          grep -F "$archive" "$RUNNER_TEMP/$checksum" | (cd "$RUNNER_TEMP" && sha256sum --check --strict -)
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-${version}-linux-x64" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender-${version}-linux-x64/blender" --version

      - name: Render geometry, quality, and art-direction comparisons
        run: |
          dotnet run --project experiments/Formloom.BlenderCube/Formloom.BlenderCube.csproj --configuration Release -- \
            --blender blender \
            --output-dir artifacts/blender-cube \
            --resolution 384 \
            --samples 12 \
            --denoise true

      - name: Verify Blender experiment outputs
        run: |
          set -euo pipefail
          test -s artifacts/blender-cube/manifest.json
          count="$(find artifacts/blender-cube -maxdepth 1 -type f -name '*.png' | wc -l)"
          if [[ "$count" -ne 26 ]]; then
            echo "Expected 26 Blender renders, found $count" >&2
            exit 1
          fi

      - name: Upload Blender art-direction review renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-cube-review
          path: artifacts/blender-cube/
          if-no-files-found: error
